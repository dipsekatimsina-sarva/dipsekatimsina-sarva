<g>
<animateTransform attributeName="transform" type="scale" values="0;0;1;1;0;0" keyTimes="0;0.62;0.72;0.85;0.95;1" dur="24s" repeatCount="indefinite" additive="sum"/>
<use href="#flower-orange"/>
</g>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.72;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</g>

<g transform="translate(597, 92)" opacity="0">
<g>
<animateTransform attributeName="transform" type="scale" values="0;0;1;1;0;0" keyTimes="0;0.7;0.8;0.85;0.95;1" dur="24s" repeatCount="indefinite" additive="sum"/>
<use href="#flower-mustard"/>
</g>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7;0.8;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</g>

<g transform="translate(687, 63)" opacity="0">
<g>
<animateTransform attributeName="transform" type="scale" values="0;0;0.9;0.9;0;0" keyTimes="0;0.75;0.83;0.85;0.95;1" dur="24s" repeatCount="indefinite" additive="sum"/>
<use href="#flower-pink"/>
</g>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.83;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</g>

<g transform="translate(220, 40)" opacity="0">
<g>
<animateTransform attributeName="transform" type="scale" values="0;0;1;1;0;0" keyTimes="0;0.45;0.55;0.85;0.95;1" dur="24s" repeatCount="indefinite" additive="sum"/>
<use href="#bud"/>
</g>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.55;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
