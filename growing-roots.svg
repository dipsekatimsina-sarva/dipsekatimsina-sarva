<g transform="translate(395, 60)" opacity="0">
<g>
<animateTransform attributeName="transform" type="scale" values="0;0;1;1;0;0" keyTimes="0;0.55;0.62;0.85;0.95;1" dur="24s" repeatCount="indefinite" additive="sum"/>
<use href="#bud"/>
