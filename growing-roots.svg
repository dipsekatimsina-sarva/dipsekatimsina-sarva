<svg width="100%" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Growing roots with blooming wildflowers — Dipseka Timsina</title>
<desc>An animated SVG where tree roots slowly grow and branch across a contribution-graph-style grid, with small wildflowers blooming along the way in warm rust, mustard, and dusty pink tones, on a slow 24-second loop.</desc>

<defs>
<linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#3a2818"/>
<stop offset="50%" stop-color="#5a3e22"/>
<stop offset="100%" stop-color="#7a5a32"/>
</linearGradient>

<linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#7ba85f"/>
<stop offset="100%" stop-color="#3a5433"/>
</linearGradient>

<filter id="softGlow">
<feGaussianBlur stdDeviation="1.2" result="coloredBlur"/>
<feMerge>
<feMergeNode in="coloredBlur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<g id="flower-orange">
<circle cx="0" cy="-3.2" r="2.2" fill="#c9542a"/>
<circle cx="3" cy="-1" r="2.2" fill="#c9542a"/>
<circle cx="1.9" cy="2.6" r="2.2" fill="#c9542a"/>
<circle cx="-1.9" cy="2.6" r="2.2" fill="#c9542a"/>
<circle cx="-3" cy="-1" r="2.2" fill="#c9542a"/>
<circle cx="0" cy="0" r="1.5" fill="#e8b820"/>
</g>

<g id="flower-mustard">
<circle cx="0" cy="-3" r="2" fill="#d49020"/>
<circle cx="2.85" cy="-0.93" r="2" fill="#d49020"/>
<circle cx="1.76" cy="2.43" r="2" fill="#d49020"/>
<circle cx="-1.76" cy="2.43" r="2" fill="#d49020"/>
<circle cx="-2.85" cy="-0.93" r="2" fill="#d49020"/>
<circle cx="0" cy="0" r="1.3" fill="#3a2818"/>
</g>

<g id="flower-pink">
<circle cx="0" cy="-3" r="2" fill="#c08070"/>
<circle cx="2.85" cy="-0.93" r="2" fill="#c08070"/>
<circle cx="1.76" cy="2.43" r="2" fill="#c08070"/>
<circle cx="-1.76" cy="2.43" r="2" fill="#c08070"/>
<circle cx="-2.85" cy="-0.93" r="2" fill="#c08070"/>
<circle cx="0" cy="0" r="1.3" fill="#e8b820"/>
</g>

<g id="bud">
<circle cx="0" cy="0" r="1.6" fill="#a85030"/>
<circle cx="0" cy="-0.4" r="1" fill="#c9542a"/>
</g>

<g id="leaf-mini">
<ellipse cx="0" cy="0" rx="2.5" ry="1.3" fill="#5a7a3a" transform="rotate(20)"/>
</g>

<pattern id="cellPattern" x="0" y="0" width="13" height="13" patternUnits="userSpaceOnUse">
<rect x="0" y="0" width="11" height="11" rx="2" fill="#2a1c10" stroke="#3a2818" stroke-width="0.5"/>
</pattern>
</defs>

<rect width="800" height="220" fill="#1a1208"/>

<g opacity="0.06" fill="none" stroke="#8a7045" stroke-width="0.5">
<circle cx="100" cy="110" r="60"/>
<circle cx="100" cy="110" r="100"/>
<circle cx="700" cy="110" r="60"/>
<circle cx="700" cy="110" r="100"/>
</g>

<rect x="40" y="40" width="689" height="91" fill="url(#cellPattern)"/>

<g transform="translate(40, 40)" stroke="url(#rootGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">

<path d="M 0 45 Q 50 40, 100 50 T 200 55 Q 250 60, 300 50 T 450 60 Q 550 55, 689 65" stroke-width="2.5" stroke-dasharray="2000" stroke-dashoffset="2000">
<animate attributeName="stroke-dashoffset" values="2000;0;0;2000" keyTimes="0;0.4;0.85;1" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.9;0.9;0.9;0;0" keyTimes="0;0.4;0.8;0.95;1" dur="24s" repeatCount="indefinite"/>
</path>

<path d="M 80 48 Q 85 55, 90 70 Q 95 80, 100 88" stroke-width="1.8" stroke-dasharray="200" stroke-dashoffset="200">
<animate attributeName="stroke-dashoffset" values="200;200;0;0;200" keyTimes="0;0.15;0.45;0.85;1" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0.85;0.85;0;0" keyTimes="0;0.15;0.8;0.95;1" dur="24s" repeatCount="indefinite"/>
</path>

<path d="M 150 52 Q 155 35, 160 20 Q 165 12, 170 5" stroke-width="1.5" stroke-dasharray="200" stroke-dashoffset="200">
<animate attributeName="stroke-dashoffset" values="200;200;0;0;200" keyTimes="0;0.2;0.5;0.85;1" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0.8;0.8;0;0" keyTimes="0;0.2;0.8;0.95;1" dur="24s" repeatCount="indefinite"/>
</path>

<path d="M 280 50 Q 290 65, 295 78 Q 300 86, 310 90" stroke-width="1.6" stroke-dasharray="200" stroke-dashoffset="200">
<animate attributeName="stroke-dashoffset" values="200;200;0;0;200" keyTimes="0;0.3;0.55;0.85;1" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0.85;0.85;0;0" keyTimes="0;0.3;0.8;0.95;1" dur="24s" repeatCount="indefinite"/>
</path>

<path d="M 400 58 Q 410 40, 420 25 Q 430 18, 445 15" stroke-width="1.4" stroke-dasharray="200" stroke-dashoffset="200">
<animate attributeName="stroke-dashoffset" values="200;200;0;0;200" keyTimes="0;0.35;0.6;0.85;1" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0.8;0.8;0;0" keyTimes="0;0.35;0.8;0.95;1" dur="24s" repeatCount="indefinite"/>
</path>

<path d="M 550 60 Q 560 75, 570 85 Q 580 90, 595 90" stroke-width="1.5" stroke-dasharray="200" stroke-dashoffset="200">
<animate attributeName="stroke-dashoffset" values="200;200;0;0;200" keyTimes="0;0.45;0.65;0.85;1" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0.85;0.85;0;0" keyTimes="0;0.45;0.8;0.95;1" dur="24s" repeatCount="indefinite"/>
</path>

<path d="M 100 88 Q 105 90, 108 91" stroke-width="1" stroke-dasharray="20" stroke-dashoffset="20">
<animate attributeName="stroke-dashoffset" values="20;20;0;0;20" keyTimes="0;0.5;0.6;0.85;1" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0.7;0.7;0;0" keyTimes="0;0.5;0.8;0.95;1" dur="24s" repeatCount="indefinite"/>
</path>

<path d="M 170 5 Q 175 2, 180 0" stroke-width="0.9" stroke-dasharray="20" stroke-dashoffset="20">
<animate attributeName="stroke-dashoffset" values="20;20;0;0;20" keyTimes="0;0.55;0.65;0.85;1" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0.7;0.7;0;0" keyTimes="0;0.55;0.8;0.95;1" dur="24s" repeatCount="indefinite"/>
</path>

</g>

