<animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.05;0.15;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</rect>
<rect x="78" y="39" width="11" height="11" rx="2" fill="url(#cellGrad)" opacity="0">
<animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.1;0.2;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</rect>
<rect x="91" y="78" width="11" height="11" rx="2" fill="url(#cellGrad)" opacity="0">
<animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.2;0.3;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</rect>
<rect x="156" y="0" width="11" height="11" rx="2" fill="url(#cellGrad)" opacity="0">
<animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.25;0.35;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</rect>
<rect x="195" y="52" width="11" height="11" rx="2" fill="url(#cellGrad)" opacity="0">
<animate attributeName="opacity" values="0;0;0.7;0.7;0;0" keyTimes="0;0.27;0.37;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</rect>
<rect x="299" y="78" width="11" height="11" rx="2" fill="url(#cellGrad)" opacity="0">
<animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.4;0.5;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</rect>
<rect x="442" y="13" width="11" height="11" rx="2" fill="url(#cellGrad)" opacity="0">
<animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.45;0.55;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</rect>
<rect x="364" y="52" width="11" height="11" rx="2" fill="url(#cellGrad)" opacity="0">
<animate attributeName="opacity" values="0;0;0.6;0.6;0;0" keyTimes="0;0.42;0.52;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</rect>
<rect x="585" y="78" width="11" height="11" rx="2" fill="url(#cellGrad)" opacity="0">
<animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.55;0.65;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</rect>
<rect x="676" y="65" width="11" height="11" rx="2" fill="url(#cellGrad)" opacity="0">
<animate attributeName="opacity" values="0;0;0.8;0.8;0;0" keyTimes="0;0.6;0.7;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</rect>
</g>

<g transform="translate(40, 40)">

<g transform="translate(108, 91)" opacity="0">
<g>
<animateTransform attributeName="transform" type="scale" values="0;0;1;1;0;0" keyTimes="0;0.5;0.6;0.85;0.95;1" dur="24s" repeatCount="indefinite" additive="sum"/>
<use href="#flower-orange"/>
</g>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.6;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</g>

<g transform="translate(180, 0)" opacity="0">
<g>
<animateTransform attributeName="transform" type="scale" values="0;0;1;1;0;0" keyTimes="0;0.55;0.65;0.85;0.95;1" dur="24s" repeatCount="indefinite" additive="sum"/>
<use href="#flower-mustard"/>
</g>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.65;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</g>

<g transform="translate(312, 92)" opacity="0">
<g>
<animateTransform attributeName="transform" type="scale" values="0;0;1;1;0;0" keyTimes="0;0.6;0.7;0.85;0.95;1" dur="24s" repeatCount="indefinite" additive="sum"/>
<use href="#flower-pink"/>
</g>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.7;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
</g>

