<use href="#leaf-mini"/>
</g>

<g transform="translate(290, 70)" opacity="0">
<animate attributeName="opacity" values="0;0;0.85;0.85;0;0" keyTimes="0;0.4;0.5;0.85;0.95;1" dur="24s" repeatCount="indefinite"/>
