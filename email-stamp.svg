<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Email — say hi</title>
<desc>Postmark-style email contact stamp.</desc>
<g transform="translate(15, 10) rotate(2)">
<rect x="0" y="0" width="170" height="60" fill="#1a3a2a"/>
<rect x="0" y="0" width="170" height="60" fill="none" stroke="#0a2010" stroke-width="1" stroke-dasharray="3,2"/>
<g transform="translate(14, 18)">
<rect x="0" y="0" width="32" height="24" rx="2" fill="#f4ead4"/>
<polyline points="2,2 16,14 30,2" stroke="#1a3a2a" stroke-width="2" fill="none"/>
</g>
<text x="60" y="30" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#d4c590">Email</text>
<text x="60" y="46" font-family="Georgia, serif" font-size="10" fill="#d4c590" font-style="italic" opacity="0.85">say hi →</text>
</g>
</svg>
